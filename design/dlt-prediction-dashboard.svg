<?xml version="1.0" encoding="UTF-8"?>
<!-- 早期静态界面原型；真实网页位于 web/，此文件仅用于对照视觉设计。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">大乐透信号实验室预测界面原型</title>
  <desc id="desc">展示三组大乐透模型候选号码、统计解释、回测基线和理性购彩提示的深色数据仪表盘。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07100E"/>
      <stop offset="0.55" stop-color="#0B1714"/>
      <stop offset="1" stop-color="#121B16"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9FF8A"/>
      <stop offset="1" stop-color="#B7EF43"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A66"/>
      <stop offset="1" stop-color="#E83958"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#71E6FF"/>
      <stop offset="1" stop-color="#2D8FFF"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#D8FF5D" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#D8FF5D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#D8FF5D" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .display { font-family: "Noto Serif SC", "Songti SC", serif; }
      .ui { font-family: "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif; }
      .muted { fill: #8A9992; }
      .soft { fill: #B7C3BD; }
      .white { fill: #F3F7F3; }
      .limeText { fill: #D8FF5D; }
      .panel { fill: #101C18; stroke: #294039; stroke-width: 1; }
      .panelSoft { fill: #0C1714; stroke: #20342E; stroke-width: 1; }
      .hairline { stroke: #2B3C36; stroke-width: 1; }
      .small { font-size: 14px; letter-spacing: 1.5px; }
      .label { font-size: 16px; }
      .body { font-size: 18px; }
      .number { font-family: "DIN Alternate", "Bahnschrift", sans-serif; font-size: 22px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; fill: #FFFFFF; }
      .mono { font-family: "JetBrains Mono", "Consolas", monospace; }
    </style>
  </defs>

  <rect width="1600" height="1080" fill="url(#bg)"/>
  <rect width="1600" height="1080" fill="url(#grid)"/>
  <circle cx="1260" cy="130" r="360" fill="url(#halo)"/>
  <circle cx="1420" cy="960" r="300" fill="#3F8CFF" opacity="0.045"/>

  <!-- 顶部导航 -->
  <g class="ui">
    <text x="70" y="64" class="limeText small mono">DLT / SIGNAL LAB</text>
    <text x="70" y="107" class="white display" font-size="34" font-weight="700">大乐透号码研究终端</text>

    <g transform="translate(650 56)">
      <rect x="0" y="0" width="132" height="42" rx="21" fill="#D8FF5D"/>
      <text x="66" y="27" text-anchor="middle" fill="#0B130F" font-size="15" font-weight="700">今日推荐</text>
      <text x="178" y="27" class="soft" font-size="15">号码实验室</text>
      <text x="310" y="27" class="soft" font-size="15">历史回测</text>
    </g>

    <g transform="translate(1260 52)">
      <rect x="0" y="0" width="270" height="52" rx="14" fill="#111F1A" stroke="#2A4038"/>
      <circle cx="25" cy="26" r="5" fill="#8AE86E" filter="url(#glow)"/>
      <text x="43" y="23" class="white" font-size="14">数据已同步</text>
      <text x="43" y="41" class="muted mono" font-size="12">2,939 期 · 最新 26121</text>
      <text x="244" y="32" text-anchor="middle" class="limeText mono" font-size="15">LIVE</text>
    </g>
  </g>

  <!-- 风险提示条 -->
  <g class="ui" transform="translate(70 145)">
    <rect width="1460" height="54" rx="15" fill="#182119" stroke="#58682E"/>
    <path d="M24 34 L34 16 L44 34 Z" fill="#D8FF5D"/>
    <circle cx="34" cy="29" r="1.8" fill="#111810"/>
    <text x="62" y="33" fill="#E9F3C0" font-size="15">开奖是独立随机事件；以下内容是历史统计生成的候选组合，不改变任意单注的理论中奖概率。</text>
    <text x="1426" y="33" text-anchor="end" class="muted mono" font-size="13">1 / 21,425,712</text>
  </g>

  <!-- 左侧主推荐区 -->
  <g class="ui" transform="translate(70 230)">
    <rect width="965" height="595" rx="26" class="panel" filter="url(#shadow)"/>
    <text x="34" y="44" class="muted small mono">NEXT DRAW / 26122</text>
    <text x="34" y="94" class="white display" font-size="34" font-weight="700">模型候选组合</text>
    <text x="930" y="44" text-anchor="end" class="muted" font-size="14">生成于 2026-10-25  ·  滚动窗口 30 / 100 / 300</text>

    <!-- A -->
    <g transform="translate(28 130)">
      <rect width="909" height="126" rx="20" fill="#14241E" stroke="#3F5A4F"/>
      <rect x="0" y="0" width="8" height="126" rx="4" fill="url(#lime)"/>
      <text x="30" y="38" class="limeText small" font-weight="700">A · 均衡策略</text>
      <text x="30" y="76" class="white" font-size="25" font-weight="700">结构优先</text>
      <text x="30" y="102" class="muted" font-size="13">冷热混合 · 三区覆盖 · 奇偶 3:2</text>

      <g transform="translate(235 28)">
        <g transform="translate(0 0)"><circle cx="34" cy="34" r="32" fill="url(#front)"/><text x="34" y="35" class="number">03</text></g>
        <g transform="translate(76 0)"><circle cx="34" cy="34" r="32" fill="url(#front)"/><text x="34" y="35" class="number">10</text></g>
        <g transform="translate(152 0)"><circle cx="34" cy="34" r="32" fill="url(#front)"/><text x="34" y="35" class="number">21</text></g>
        <g transform="translate(228 0)"><circle cx="34" cy="34" r="32" fill="url(#front)"/><text x="34" y="35" class="number">26</text></g>
        <g transform="translate(304 0)"><circle cx="34" cy="34" r="32" fill="url(#front)"/><text x="34" y="35" class="number">33</text></g>
        <line x1="390" y1="10" x2="390" y2="58" stroke="#496058"/>
        <g transform="translate(420 0)"><circle cx="34" cy="34" r="32" fill="url(#back)"/><text x="34" y="35" class="number">01</text></g>
        <g transform="translate(496 0)"><circle cx="34" cy="34" r="32" fill="url(#back)"/><text x="34" y="35" class="number">07</text></g>
      </g>
      <text x="872" y="48" text-anchor="end" class="muted small">综合评分</text>
      <text x="872" y="84" text-anchor="end" class="limeText mono" font-size="28" font-weight="700">82</text>
    </g>

    <!-- B -->
    <g transform="translate(28 272)">
      <rect width="909" height="126" rx="20" fill="#111E1A" stroke="#2C443B"/>
      <text x="30" y="38" fill="#FF8B78" class="small" font-weight="700">B · 趋势策略</text>
      <text x="30" y="76" class="white" font-size="25" font-weight="700">近期动量</text>
      <text x="30" y="102" class="muted" font-size="13">近 100 期频率 · 中度重复惩罚</text>
      <g transform="translate(235 28)">
        <g transform="translate(0 0)"><circle cx="34" cy="34" r="32" fill="url(#front)"/><text x="34" y="35" class="number">06</text></g>
        <g transform="translate(76 0)"><circle cx="34" cy="34" r="32" fill="url(#front)"/><text x="34" y="35" class="number">14</text></g>
        <g transform="translate(152 0)"><circle cx="34" cy="34" r="32" fill="url(#front)"/><text x="34" y="35" class="number">22</text></g>
        <g transform="translate(228 0)"><circle cx="34" cy="34" r="32" fill="url(#front)"/><text x="34" y="35" class="number">29</text></g>
        <g transform="translate(304 0)"><circle cx="34" cy="34" r="32" fill="url(#front)"/><text x="34" y="35" class="number">35</text></g>
        <line x1="390" y1="10" x2="390" y2="58" stroke="#496058"/>
        <g transform="translate(420 0)"><circle cx="34" cy="34" r="32" fill="url(#back)"/><text x="34" y="35" class="number">04</text></g>
        <g transform="translate(496 0)"><circle cx="34" cy="34" r="32" fill="url(#back)"/><text x="34" y="35" class="number">09</text></g>
      </g>
      <text x="872" y="48" text-anchor="end" class="muted small">综合评分</text>
      <text x="872" y="84" text-anchor="end" fill="#FF8B78" class="mono" font-size="28" font-weight="700">76</text>
    </g>

    <!-- C -->
    <g transform="translate(28 414)">
      <rect width="909" height="126" rx="20" fill="#111E1A" stroke="#2C443B"/>
      <text x="30" y="38" fill="#67DFFF" class="small" font-weight="700">C · 探索策略</text>
      <text x="30" y="76" class="white" font-size="25" font-weight="700">低重合覆盖</text>
      <text x="30" y="102" class="muted" font-size="13">遗漏因子 · 与 A/B 组低重合</text>
      <g transform="translate(235 28)">
        <g transform="translate(0 0)"><circle cx="34" cy="34" r="32" fill="url(#front)"/><text x="34" y="35" class="number">07</text></g>
        <g transform="translate(76 0)"><circle cx="34" cy="34" r="32" fill="url(#front)"/><text x="34" y="35" class="number">16</text></g>
        <g transform="translate(152 0)"><circle cx="34" cy="34" r="32" fill="url(#front)"/><text x="34" y="35" class="number">23</text></g>
        <g transform="translate(228 0)"><circle cx="34" cy="34" r="32" fill="url(#front)"/><text x="34" y="35" class="number">28</text></g>
        <g transform="translate(304 0)"><circle cx="34" cy="34" r="32" fill="url(#front)"/><text x="34" y="35" class="number">34</text></g>
        <line x1="390" y1="10" x2="390" y2="58" stroke="#496058"/>
        <g transform="translate(420 0)"><circle cx="34" cy="34" r="32" fill="url(#back)"/><text x="34" y="35" class="number">05</text></g>
        <g transform="translate(496 0)"><circle cx="34" cy="34" r="32" fill="url(#back)"/><text x="34" y="35" class="number">11</text></g>
      </g>
      <text x="872" y="48" text-anchor="end" class="muted small">综合评分</text>
      <text x="872" y="84" text-anchor="end" fill="#67DFFF" class="mono" font-size="28" font-weight="700">71</text>
    </g>

    <text x="30" y="576" class="muted" font-size="13">评分用于组合排序，不等同于中奖概率。每次生成会保留随机扰动，避免伪精确。</text>
  </g>

  <!-- 右侧解释区 -->
  <g class="ui" transform="translate(1065 230)">
    <rect width="465" height="595" rx="26" class="panel" filter="url(#shadow)"/>
    <text x="30" y="44" class="muted small mono">EXPLANATION LAYER</text>
    <text x="30" y="88" class="white display" font-size="29" font-weight="700">为什么是 A 组？</text>
    <text x="30" y="119" class="muted" font-size="14">每个因素单独显示，避免“黑箱神预测”。</text>

    <g transform="translate(30 158)">
      <text x="0" y="0" class="soft" font-size="15">近期热度</text><text x="390" y="0" text-anchor="end" class="white mono" font-size="14">78</text>
      <rect x="0" y="15" width="390" height="8" rx="4" fill="#263831"/><rect x="0" y="15" width="304" height="8" rx="4" fill="#FF6572"/>

      <text x="0" y="65" class="soft" font-size="15">遗漏修正</text><text x="390" y="65" text-anchor="end" class="white mono" font-size="14">64</text>
      <rect x="0" y="80" width="390" height="8" rx="4" fill="#263831"/><rect x="0" y="80" width="250" height="8" rx="4" fill="#58CFFF"/>

      <text x="0" y="130" class="soft" font-size="15">结构合理性</text><text x="390" y="130" text-anchor="end" class="white mono" font-size="14">86</text>
      <rect x="0" y="145" width="390" height="8" rx="4" fill="#263831"/><rect x="0" y="145" width="335" height="8" rx="4" fill="#D8FF5D"/>

      <text x="0" y="195" class="soft" font-size="15">组合差异度</text><text x="390" y="195" text-anchor="end" class="white mono" font-size="14">91</text>
      <rect x="0" y="210" width="390" height="8" rx="4" fill="#263831"/><rect x="0" y="210" width="355" height="8" rx="4" fill="#9BEA7C"/>
    </g>

    <line x1="30" y1="405" x2="435" y2="405" class="hairline"/>
    <text x="30" y="444" class="muted small mono">CURRENT SIGNALS</text>
    <g transform="translate(30 466)">
      <rect width="126" height="78" rx="15" fill="#15251F"/>
      <text x="15" y="27" class="muted" font-size="12">近 30 期热号</text>
      <text x="15" y="56" fill="#FF806F" class="mono" font-size="17" font-weight="700">10 · 06 · 14</text>
      <rect x="139" width="126" height="78" rx="15" fill="#15251F"/>
      <text x="154" y="27" class="muted" font-size="12">前区最大遗漏</text>
      <text x="154" y="56" fill="#67DFFF" class="mono" font-size="17" font-weight="700">23 / 38期</text>
      <rect x="278" width="126" height="78" rx="15" fill="#15251F"/>
      <text x="293" y="27" class="muted" font-size="12">后区最大遗漏</text>
      <text x="293" y="56" fill="#67DFFF" class="mono" font-size="17" font-weight="700">05 / 26期</text>
    </g>
    <text x="30" y="574" class="muted" font-size="12">热号与遗漏只描述历史，不代表下一期更容易出现。</text>
  </g>

  <!-- 底部流程与控制 -->
  <g class="ui" transform="translate(70 855)">
    <rect width="1000" height="166" rx="24" class="panelSoft"/>
    <text x="28" y="38" class="muted small mono">BACKEND PIPELINE</text>
    <g transform="translate(28 62)">
      <g><rect width="150" height="64" rx="15" fill="#172720"/><text x="75" y="28" text-anchor="middle" class="white" font-size="15" font-weight="700">数据校验</text><text x="75" y="48" text-anchor="middle" class="muted" font-size="11">去重 · 范围 · 日期</text></g>
      <path d="M164 32 H194" stroke="#557068" stroke-width="2"/><path d="M188 26 L196 32 L188 38" fill="none" stroke="#557068" stroke-width="2"/>
      <g transform="translate(210 0)"><rect width="150" height="64" rx="15" fill="#172720"/><text x="75" y="28" text-anchor="middle" class="white" font-size="15" font-weight="700">滚动特征</text><text x="75" y="48" text-anchor="middle" class="muted" font-size="11">30 / 100 / 300 期</text></g>
      <path d="M374 32 H404" stroke="#557068" stroke-width="2"/><path d="M398 26 L406 32 L398 38" fill="none" stroke="#557068" stroke-width="2"/>
      <g transform="translate(420 0)"><rect width="150" height="64" rx="15" fill="#172720"/><text x="75" y="28" text-anchor="middle" class="white" font-size="15" font-weight="700">走步回测</text><text x="75" y="48" text-anchor="middle" class="muted" font-size="11">严格隔离未来数据</text></g>
      <path d="M584 32 H614" stroke="#557068" stroke-width="2"/><path d="M608 26 L616 32 L608 38" fill="none" stroke="#557068" stroke-width="2"/>
      <g transform="translate(630 0)"><rect width="150" height="64" rx="15" fill="#172720"/><text x="75" y="28" text-anchor="middle" class="white" font-size="15" font-weight="700">约束采样</text><text x="75" y="48" text-anchor="middle" class="muted" font-size="11">分区 · 奇偶 · 去重</text></g>
      <path d="M794 32 H824" stroke="#557068" stroke-width="2"/><path d="M818 26 L826 32 L818 38" fill="none" stroke="#557068" stroke-width="2"/>
      <g transform="translate(840 0)"><rect width="104" height="64" rx="15" fill="url(#lime)"/><text x="52" y="28" text-anchor="middle" fill="#0D1712" font-size="15" font-weight="800">推荐</text><text x="52" y="48" text-anchor="middle" fill="#31401B" font-size="11">含解释</text></g>
    </g>
  </g>

  <g class="ui" transform="translate(1095 855)">
    <rect width="435" height="166" rx="24" fill="#D8FF5D"/>
    <text x="26" y="38" fill="#34401F" class="small mono">RESPONSIBLE PLAY</text>
    <text x="26" y="78" fill="#0B130F" class="display" font-size="27" font-weight="800">理性预算模式</text>
    <text x="26" y="108" fill="#384523" font-size="14">建议单次不超过 3 组，默认预算上限 ¥20。</text>
    <rect x="26" y="126" width="210" height="4" rx="2" fill="#93B33A"/>
    <rect x="26" y="126" width="82" height="4" rx="2" fill="#142013"/>
    <text x="405" y="133" text-anchor="end" fill="#263219" class="mono" font-size="13">¥ 6 / ¥ 20</text>
  </g>

  <text x="70" y="1057" class="ui muted" font-size="12">原型 v0.1 · 统计研究用途 · 不构成投资或投注建议</text>
  <text x="1530" y="1057" text-anchor="end" class="ui muted mono" font-size="12">DLT SIGNAL LAB / 2026</text>
</svg>
